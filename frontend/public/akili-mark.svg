<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="AKILI">
  <!--
    The AKILI mark: a geometric brain.

    A rotated rounded square — Binance's diamond geometry as a language, not as
    a logo — cut by a vertical fissure into two hemispheres, each grooved with a
    folded gyrus. AKILI's own mark, legible down to 16px.
  -->
  <defs>
    <mask id="akili-brain">
      <rect x="6" y="6" width="20" height="20" rx="4.5" transform="rotate(45 16 16)" fill="#fff"/>
      <g stroke="#000" stroke-width="2.15" stroke-linecap="round" fill="none">
        <path d="M16 5.4V26.6"/>
        <path d="M13.4 10.8C9 11.8 9 15.2 12.4 16 9 16.8 9 20.2 13.4 21.2"/>
        <path d="M18.6 10.8C23 11.8 23 15.2 19.6 16 23 16.8 23 20.2 18.6 21.2"/>
      </g>
    </mask>
  </defs>
  <rect width="32" height="32" fill="#19B5A5" mask="url(#akili-brain)"/>
</svg>
